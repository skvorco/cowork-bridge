name: Build APK

on:
  push:
    branches:
      - claude/eye-distance-android-app-zwMtS
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyeguard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Хранитель зрения (debug)
          body: |
            Готовый APK приложения «Хранитель зрения».
            Скачай файл app-debug.apk ниже и установи на телефон.
            Сборка от коммита ${{ github.sha }}.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
